services:
  product-service:
    build:
      context: ./product_service
    container_name: product-service
    ports:
      - "8001:8000"
    networks:
      - service-net

  discount-service:
    build:
      context: ./discount_service
    container_name: discount-service
    ports:
      - "8003:8000"
    networks:
      - service-net

  order-service:
    build:
      context: ./order_service
    container_name: order-service
    ports:
      - "8002:8000"
    environment:
      PRODUCT_SERVICE_URL: "http://product-service:8000"
      DISCOUNT_SERVICE_URL: "http://discount-service:8000"
      DATABASE_URL: "postgresql://orders:orders@db:5432/orders"
    depends_on:
      - product-service
      - discount-service
      - db
    networks:
      - service-net

  db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - service-net

networks:
  service-net:

volumes:
  order-db-data: